# Render Blueprint for the backend API (free plan is enough for the demo).
services:
  - type: web
    name: agentflow-dev-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: LLM_PROVIDER
        value: anthropic          # anthropic | openai | mock | none
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: ANTHROPIC_API_KEY
        sync: false               # set in the Render dashboard, never in git
      - key: ALLOWED_ORIGINS
        sync: false               # e.g. https://agentflow-dev.vercel.app
      - key: MAX_COST_PER_WORKFLOW_USD
        value: "0.50"
      - key: RATE_LIMIT_PER_IP_PER_HOUR
        value: "5"
      - key: QUOTA_PER_SESSION
        value: "2"
      - key: MAX_LIVE_WORKFLOWS_PER_DAY
        value: "50"
