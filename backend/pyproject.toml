[project]
name = "agentflow-backend"
version = "0.1.0"
description = "AgentFlow Dev backend: LangGraph multi-agent orchestration API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.8.0",
    "fastapi>=0.162.7",
    "langchain-core>=1.8.0",
    "langgraph>=1.2.21",
    "openai>=3.51.0",
    "pydantic>=2.14.3",
    "pyflakes>=4.1.0",
    "sse-starlette>=3.7.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
